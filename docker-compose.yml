version: '3.8'

services:

  payment-service:
    build: ./payment-service
    ports:
      - "8082:8082"

  order-service:
    build: ./order-service
    ports:
      - "8081:8081"
    depends_on:
      - payment-service

  api-gateway:
    build: ./api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - order-service